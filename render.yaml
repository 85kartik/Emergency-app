services:
  # 1. Backend REST & WebSocket API
  - type: web
    name: emergency-response-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "*"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

  # 2. Admin & Dispatch Web Dashboard
  - type: web
    name: emergency-response-admin
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://emergency-response-api.onrender.com
